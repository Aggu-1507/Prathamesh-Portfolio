<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page moved | Prathamesh V Narayan</title>
  <meta name="robots" content="noindex">
  <script>
    // Links to the old address (/Prathamesh-Portfolio/...) are sent to the same page at the new one.
    (function () {
      var oldBase = '/prathamesh-portfolio';
      var path = window.location.pathname;
      var lower = path.toLowerCase();
      if (lower === oldBase || lower.indexOf(oldBase + '/') === 0) {
        var rest = path.slice(oldBase.length) || '/';
        window.location.replace(rest + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: #eef6fd;
      color: #10294f;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 34rem;
    }
    .eyebrow {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #4a6283;
    }
    h1 {
      margin: 0.6rem 0 1rem;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
    }
    a {
      color: #1763b5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Page not found</p>
    <h1>This page is not here.</h1>
    <p>Prathamesh V Narayan's portfolio is at <a href="https://aggu-1507.github.io/">aggu-1507.github.io</a>.</p>
  </main>
</body>
</html>
